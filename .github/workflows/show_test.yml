name: Yeni format uctan uca test (Claude senaryo + render + thumbnail, yukleme YOK)

on:
  push:
    branches: [visual-proto]
  workflow_dispatch: {}

jobs:
  show-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core libegl1 libgl1 libfontconfig1
          pip install -r requirements.txt -r requirements-visual.txt -r requirements-vocal.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fluent cizimleri
        uses: actions/cache@v4
        with:
          path: asset_cache
          key: fluent-1ffb34c-${{ hashFiles('assets.py') }}
      - name: CC0 ses ornekleri
        uses: actions/cache@v4
        with:
          path: sample_cache
          key: cc0-samples-${{ hashFiles('samples.py') }}
      - name: Gercek hayvan sesleri (BigSoundBank, CC0)
        uses: actions/cache@v4
        with:
          path: sfx_cache
          key: bigsoundbank-${{ hashFiles('animal_sounds.py') }}
      - name: Ses bankasi (ASLA artifact yapilmaz -- ToU)
        uses: actions/cache@v4
        with:
          path: voicebank_cache/hanami_v1.0.zip
          key: hanami-diffsinger-v1.0
      - name: BigVGAN agirliklari
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bigvgan-v2-44k-95a9d1d
      - name: Uctan uca test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_VOICE: "en-US-AnaNeural"
          # H8 uctan uca (todo 7h): gercek Claude fikir + senaryo + baslik olcumu + render, yukleme YOK
          SHOW_JSON: ""
          # H14: "trip" = traktor yolculugu deneme bolumu (gercek Claude senaryosu); "" = hikaye-sarki
          EPISODE_TEST_FORMAT: "trip"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        # Hata olursa son satirlar herkese acik "annotation" olarak yazilir (log API'si kimlik istiyor, E11).
        # Gizli bilgi sizmasin: token/secret/key/authorization gecen satirlar ve uzun anahtar benzeri
        # dizgeler atilir (C4b).
        run: |
          mkdir -p out
          set -o pipefail
          python show_test.py 2>&1 | tee out/log.txt || {
            msg=$(tail -n 40 out/log.txt | grep -viE 'token|secret|api[_-]?key|authorization|bearer|password' \
                  | sed -E 's/[A-Za-z0-9_\-]{32,}/[gizli?]/g; s/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=show_test hatasi::${msg}"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yeni-format-test
          path: |
            out/episode.mp4
            out/short_*.mp4
            out/short_*.png
            out/kare_*.png
            out/thumb_*.jpg
            out/thumb_onizleme.png
            out/senaryo.txt
            out/senaryo.json
            out/aciklama.txt
            out/rapor.txt
            out/log.txt
