name: Bolum testi (yeni muzik molasi, yukleme YOK)

on:
  push:
    branches: [vocal-integration]
  workflow_dispatch: {}

jobs:
  episode-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt -r requirements-vocal.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: CC0 ses ornekleri
        uses: actions/cache@v4
        with:
          path: sample_cache
          key: cc0-samples-${{ hashFiles('samples.py') }}
      - name: Ses bankasi (ASLA artifact yapilmaz -- ToU)
        uses: actions/cache@v4
        with:
          path: voicebank_cache/hanami_v1.0.zip
          key: hanami-diffsinger-v1.0
      - name: BigVGAN agirliklari
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bigvgan-v2-44k-95a9d1d
      - name: Senaryo + kisa bolum + olcum
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_VOICE: "en-US-AnaNeural"
        run: python episode_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolum-testi
          path: |
            out/episode_test.mp4
            out/episode_test_report.txt
            out/test_script.txt
            out/frame_*.png
