name: Vokal testi (Hanami + BigVGAN)

on:
  workflow_dispatch: {}

jobs:
  vocal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          pip install onnxruntime==1.20.1 pyyaml==6.0.2 librosa==0.10.2.post1 scipy==1.14.1 \
                      matplotlib==3.9.2 tqdm==4.67.1 huggingface_hub==0.26.2
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: CC0 ses ornekleri
        uses: actions/cache@v4
        with:
          path: sample_cache
          key: cc0-samples-${{ hashFiles('samples.py') }}
      - name: Ses bankasi (ASLA artifact yapilmaz -- ToU)
        uses: actions/cache@v4
        with:
          path: voicebank_cache/hanami_v1.0.zip
          key: hanami-diffsinger-v1.0
      - name: BigVGAN agirliklari
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bigvgan-v2-44k-95a9d1d
      - name: Vokal uret ve olc
        run: python vocal_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vokal-testi
          path: |
            out/vocal_test.mp3
            out/vocal_test_dry.mp3
            out/vocal_test_report.txt
