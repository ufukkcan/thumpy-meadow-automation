name: Onayli test ciktisini yayinla (yeniden render yok)

# publish/request.json main'e gonderilince calisir. Ayni istek iki kez yuklenmez (state/published.json).
on:
  push:
    branches: [main]
    paths: ["publish/request.json"]

concurrency:
  group: thumpy-check-and-produce        # state yazan is akisiyla ayni grup: cakisma olmasin
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core libegl1 libgl1 libfontconfig1
          pip install -r requirements.txt -r requirements-visual.txt
      - name: Istek
        id: req
        run: echo "run_id=$(python -c "import json; print(json.load(open('publish/request.json'))['run_id'])")" >> "$GITHUB_OUTPUT"
      - name: Test ciktisini indir
        uses: actions/download-artifact@v4
        with:
          name: yeni-format-test
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: published_in
      - name: Yukle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ls -la published_in
          set -o pipefail
          python publish_artifact.py 2>&1 | tee publish_log.txt || {
            msg=$(tail -n 30 publish_log.txt | grep -viE 'token|secret|api[_-]?key|authorization|bearer|password' \
                  | sed -E 's/[A-Za-z0-9_\-]{32,}/[gizli?]/g; s/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=yayinlama hatasi::${msg}"
            exit 1
          }
          echo "::notice title=yayinlandi::$(grep -E 'youtu.be|Yayin|Baslik' publish_log.txt | tr '\n' ' ')"
      - name: State kaydet
        if: always()
        run: |
          git config user.name "thumpy-bot"
          git config user.email "thumpy-bot@users.noreply.github.com"
          git add state
          git diff --quiet --cached || git commit -m "State guncellendi (yayin)"
          git pull --rebase --autostash || true
          git push
