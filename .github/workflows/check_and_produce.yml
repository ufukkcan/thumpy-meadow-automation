name: Thumpy Meadow - kontrol ve uretim

on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch: {}

concurrency:
  group: thumpy-check-and-produce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          # skia-python Linux'ta EGL/GL ve fontconfig paylasimli kutuphanelerini ister (yeni cizim motoru)
          sudo apt-get install -y ffmpeg fonts-dejavu-core libegl1 libgl1 libfontconfig1
          pip install -r requirements.txt -r requirements-visual.txt
          # vokal bagimliliklari (torch vb.) yalnizca sarki uretilirken vocal_break kurar

      - name: Fluent cizimleri
        uses: actions/cache@v4
        with:
          path: asset_cache
          key: fluent-1ffb34c-${{ hashFiles('assets.py') }}
      - name: CC0 ses ornekleri
        uses: actions/cache@v4
        with:
          path: sample_cache
          key: cc0-samples-${{ hashFiles('samples.py') }}
      - name: Gercek hayvan sesleri (BigSoundBank, CC0)
        uses: actions/cache@v4
        with:
          path: sfx_cache
          key: bigsoundbank-${{ hashFiles('animal_sounds.py') }}
      - name: Ses bankasi (ASLA artifact yapilmaz -- ToU)
        uses: actions/cache@v4
        with:
          path: voicebank_cache/hanami_v1.0.zip
          key: hanami-diffsinger-v1.0
      - name: BigVGAN agirliklari
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bigvgan-v2-44k-95a9d1d

      - name: Kontrol et, gerekiyorsa uret ve yukle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TTS_VOICE: "en-US-AnaNeural"
          AUTO_TRIGGER_TIME: "11:00"
        run: python check_and_produce.py

      - name: State kaydet
        if: always()
        run: |
          git config user.name "thumpy-bot"
          git config user.email "thumpy-bot@users.noreply.github.com"
          mkdir -p state
          git add state
          git diff --quiet --cached || git commit -m "State guncellendi"
          git pull --rebase --autostash || true
          git push
