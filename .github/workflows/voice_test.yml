name: Ses testi (Ana vs Jenny)

on:
  workflow_dispatch: {}

jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Iki sesle test bolumu uret
        run: python voice_test.py

      - name: Videolari indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: ses-testi-videolari
          path: out/*.mp4
