name: Gorsel prototip (Skia + Fluent, yukleme YOK)

on:
  push:
    branches: [visual-proto]
  workflow_dispatch: {}

jobs:
  visual-proto:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt -r requirements-visual.txt -r requirements-vocal.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fluent cizimleri
        uses: actions/cache@v4
        with:
          path: asset_cache
          key: fluent-1ffb34c-${{ hashFiles('assets.py') }}
      - name: CC0 ses ornekleri
        uses: actions/cache@v4
        with:
          path: sample_cache
          key: cc0-samples-${{ hashFiles('samples.py') }}
      - name: Ses bankasi (ASLA artifact yapilmaz -- ToU)
        uses: actions/cache@v4
        with:
          path: voicebank_cache/hanami_v1.0.zip
          key: hanami-diffsinger-v1.0
      - name: BigVGAN agirliklari
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bigvgan-v2-44k-95a9d1d
      - name: Prototip uret
        env:
          TTS_VOICE: "en-US-AnaNeural"
        run: python visual_proto.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gorsel-prototip
          path: |
            out/visual_proto.mp4
            out/visual_proto_report.txt
            out/smoke.png
            out/assets_sheet.png
            out/proto_*.png
